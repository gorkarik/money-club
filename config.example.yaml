# MONEY CLUB — настройки стратегии (форк entropy-arb)
#
# Обычно этот файл руками трогать не нужно: пороги и лимиты меняются
# через меню (команда moneyclub → Настройки). Меню само создаёт config.yaml
# из этого шаблона при первом запуске.
#
# Ключи (секреты) здесь НЕ хранятся — они лежат в .env.
# Все названия параметров проверяются при старте: опечатка в имени —
# это ошибка запуска, а не тихо проигнорированная настройка.
#
# Тикер и площадка хеджа в этом файле не задаются, их передаёт меню:
#     SNDK, хедж — Lighter Robinhood chain (lighter-rh)

# =============================== СИГНАЛ ===============================
# premium_bps = (цена Entropy / цена хеджа − 1) × 10000
#
#   ПРОДАТЬ entropy + КУПИТЬ хедж   когда премия >= midline + upper
#   КУПИТЬ entropy + ПРОДАТЬ хедж   когда премия <= midline − lower
#
# Оба порога считаются уже ПОСЛЕ комиссий (бот сам добавляет комиссии
# сверху), поэтому полный цикл вход+выход даёт >= upper + lower bps.
#
# Значения по умолчанию — калибровка по ~4 суткам записи SNDK/RH.
# Премия со временем дрейфует: раз в неделю делайте «Анализ / калибровку».
thresholds:
  midline_bps: -7.0    # обычный уровень премии (центр коридора)
  upper_bps: 4.0       # на сколько выше центра — продаём Entropy
  lower_bps: 4.5       # на сколько ниже центра — покупаем Entropy

# =============================== БИРЖИ ================================
entropy:
  dex: io                    # имя dex Entropy на Hyperliquid
  taker_fee_bps: 0.0         # комиссия тейкера
  max_position_usd: 25       # лимит позиции, $ (меню меняет его сразу в обеих секциях)
  max_orders_per_min: 120    # лимит отправки ордеров в минуту

hedge:
  taker_fee_bps: 0.0         # у Lighter 0; у tradexyz ~1.0
  max_position_usd: 25       # лимит позиции, $ (должен совпадать с entropy)
  max_orders_per_min: 30     # потолок Lighter ~40 в минуту, держим запас

# ============================ РАЗМЕР СДЕЛОК ===========================
sizing:
  take_fraction: 0.5           # какую долю выгодной глубины стакана забирать
  max_order_notional_usd: 20   # максимум на одну сделку, $
  min_order_notional_usd: 10   # сделки меньше этой суммы не отправляются

# ======================== ЛЕСЕНКА ПО ПОЗИЦИИ ==========================
# Чем ближе позиция к лимиту в одну сторону, тем большую премию бот
# требует для добавления в ту же сторону (линейно до scale_bps на 100%
# лимита). Не даёт быстро набить односторонний перекос. 0 — выключено.
inventory:
  scale_bps: 10.0
  floor_frac: 0

# ============================== ИСПОЛНЕНИЕ ============================
execution:
  premium_persist_sec: 0       # сколько секунд сигнал должен держаться до входа
  cooldown_sec: 0.0            # минимальная пауза между сделками
  settle_timeout_sec: 10.0     # ожидание подтверждения исполнения
  leg_slippage_bps: 50.0       # защита от проскальзывания на каждой ноге
  hedge_slippage_bps: 20.0     # защита цены при выравнивании дельты
  net_tolerance_base: 0.001    # допустимый перекос позиций (в базовом активе)
  max_consecutive_errors: 3    # после N ошибок подряд — аварийная остановка
  rate_limit_pause_sec: 10.0   # пауза, если биржа ограничила частоту запросов
  staleness_sec: 10.0          # данные старше — считаются устаревшими
  reconcile_sec: 15.0          # как часто сверять позиции с биржей
  venue_probe_sec: 30.0        # как часто проверять недоступную биржу
  http_keepalive_sec: 10.0     # держать соединение для ордеров «тёплым»; 0 — выкл.

# ============================= ЗАПИСЬ ДАННЫХ ==========================
# Пока бот работает (в любом режиме), он раз в секунду снимает оба стакана
# и раз в минуту пишет строку в CSV. Эти данные использует анализ.
recorder:
  enabled: true
  csv: logs/minutes.csv

# ============================= ЛОГИ И ДАШБОРД =========================
logging:
  level: INFO
  status_interval_sec: 30.0
  trades_csv: logs/trades.csv
  dashboard: true
  file: logs/engine.log
